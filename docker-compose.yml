services:
  db:
    image: postgres:15-alpine
    container_name: bakeriq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bakeriq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bakeriq-api
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db_test:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bakeriq-worker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      watchmedo auto-restart --directory=./app --pattern=*.py --recursive -- celery -A app.core.celery_app worker --loglevel=info -E -n bakeriq-worker@%h --concurrency=2

  frontend:
    build:
      context: ./frontend
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bakeriq-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

  frontend-customer:
    build:
      context: ./frontend-customer
      dockerfile: Dockerfile.dev
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: bakeriq-frontend-customer
    restart: unless-stopped
    volumes:
      - ./frontend-customer:/app
      - /app/node_modules
    ports:
      - "5174:5174"
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0 --port 5174

  db_test:
    image: postgres:15-alpine
    container_name: bakeriq-db-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: bakeriq_test
      POSTGRES_PASSWORD: bakeriq_test_password
      POSTGRES_DB: bakeriq_test
    ports:
      - "5433:5432" # different host port to avoid clash with main db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U bakeriq_test -d bakeriq_test" ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
